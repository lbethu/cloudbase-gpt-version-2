# The three above may upload and draft. Approving — the act that makes a
# document Cloudpoint's official answer — is deliberately not among their
# roles, so every uploaded SOP still waits for a named approver.
#
# `.invalid` is the domain reserved for placeholders, so nothing can ever
# accidentally send mail to these addresses. Swap in real ones when you have
# them; the access codes are keyed to the names, so changing an address does
